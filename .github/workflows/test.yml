name: Tests

on:
  push:
  pull_request:
    branches: [ master ]

defaults:
  run:
    shell: bash -l {0}

jobs:
  run_style_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        init-shell: bash
    - run: pycodestyle $(git ls-files "*.py")

  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        init-shell: bash
    - run: python -m unittest unit_tests/test_my_utils.py

  run_functional_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        init-shell: bash
    - run: python functional_tests/test_print_fires.sh
